<h3>Песочница карты — конвейер правил</h3>
<div class="controls">
  <label>Сид <input id="seed" type="number" value="1" style="width:90px"></label>

<div class="wrap">
  <svg id="svg"></svg>
  <div class="side"><div id="info"></div><h4>Типы дорог <span class="meta">(сверху — главные; последний — тропы нижних уровней)</span></h4><div id="roadTypes"></div><h4>Правила</h4><div id="rules"></div><h4>Биомы</h4><div class="legend" id="legend"></div></div>
</div>
<script>
'use strict';
// ================= геометрия (flat-top, масштаб 10, 100 детей) =================
const SQ3 = Math.sqrt(3);
const DIRS = [[1,0],[1,-1],[0,-1],[-1,0],[-1,1],[0,1]];
const DIRS_RU = ['ЮВ', 'СВ', 'С', 'СЗ', 'ЮЗ', 'Ю'];
const OWNED = new Set([0,2,4]);
const toPx = (q, r, size = 1) => [size * 1.5 * q, size * SQ3 * (r + q / 2)];
const hexNorm = (x, y, size) => Math.max(Math.abs(y) / (size * SQ3 / 2), (SQ3 * Math.abs(x) + Math.abs(y)) / (size * SQ3));
function cubeRound(fq, fr) {
  const fs = -fq - fr; let q = Math.round(fq), r = Math.round(fr), s = Math.round(fs);
  const dq = Math.abs(q - fq), dr = Math.abs(r - fr), ds = Math.abs(s - fs);
  if (dq > dr && dq > ds) q = -r - s; else if (dr > ds) r = -q - s; return [q, r];
}
const childRound = (x, y) => cubeRound(2 / 3 * x, -x / 3 + SQ3 / 3 * y); // точка → гекс (размер 1)
function parentOf(q, r) {
  const [x, y] = toPx(q, r), S = 10;
  const [Q0, R0] = cubeRound((2 / 3 * x) / S, (-x / 3 + SQ3 / 3 * y) / S);
  const hits = [[Q0, R0], ...DIRS.map(([a, b]) => [Q0 + a, R0 + b])]
    .filter(([Q, R]) => { const [cx, cy] = toPx(Q, R, S); return hexNorm(x - cx, y - cy, S) <= 1 + 1e-9; });
  if (hits.length === 1) return hits[0];
  const [A, B] = hits; const i = DIRS.findIndex(([a, b]) => A[0] + a === B[0] && A[1] + b === B[1]);
  return OWNED.has(i) ? A : B;
}
const CHILD_OFFSETS = [];
for (let q = -10; q <= 10; q++) for (let r = -10; r <= 10; r++) { const [Q, R] = parentOf(q, r); if (Q === 0 && R === 0) CHILD_OFFSETS.push([q, r]); }
CHILD_OFFSETS.sort((a, b) => (2 * a[1] + a[0]) - (2 * b[1] + b[0]) || a[0] - b[0]); // построчно
const RING2 = []; for (let a = -2; a <= 2; a++) for (let b = Math.max(-2, -a - 2); b <= Math.min(2, -a + 2); b++) RING2.push([a, b]);
const K = (q, r) => q + ',' + r;
const hexDist = (a, b) => (Math.abs(a[0] - b[0]) + Math.abs(a[1] - b[1]) + Math.abs(a[0] + a[1] - b[0] - b[1])) / 2;
const dirIndex = (a, b) => DIRS.findIndex(([x, y]) => a[0] + x === b[0] && a[1] + y === b[1]);
const unitDir = e => { const [x, y] = toPx(DIRS[e][0], DIRS[e][1]); return [x / SQ3, y / SQ3]; };
function hexLine(a, b) {
  const n = hexDist(a, b), res = [];
  for (let i = 0; i <= n; i++) { const t = n ? i / n : 0; res.push(cubeRound(a[0] + (b[0] - a[0]) * t + 1e-6, a[1] + (b[1] - a[1]) * t + 1e-6)); }
  return res;
}

// ================= случайность (детерминирована от сида) =================
let SEED = 1;
function hash(...ns) {
  let h = (0x9e3779b9 ^ SEED) | 0;
  for (const n of ns) { h = Math.imul(h ^ (n | 0), 0x85ebca6b); h ^= h >>> 13; h = Math.imul(h, 0xc2b2ae35); h ^= h >>> 16; }
  return (h >>> 0) / 4294967296;
}
function rngFrom(...ns) { let a = Math.floor(hash(...ns) * 4294967296); return () => { a = (a + 0x6D2B79F5) | 0; let t = Math.imul(a ^ (a >>> 15), 1 | a); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; }
const strHash = s => { let h = 2166136261; for (const ch of s) h = Math.imul(h ^ ch.charCodeAt(0), 16777619); return h | 0; };
function vnoise(x, y, a, b, c) {
  const ix = Math.floor(x), iy = Math.floor(y), fx = x - ix, fy = y - iy;
  const sx = fx * fx * (3 - 2 * fx), sy = fy * fy * (3 - 2 * fy);
  const p = hash(a, b, c, ix, iy), q = hash(a, b, c, ix + 1, iy), r = hash(a, b, c, ix, iy + 1), s = hash(a, b, c, ix + 1, iy + 1);
  return p + (q - p) * sx + (r - p) * sy + (p - q - r + s) * sx * sy;
}
const fbm = (x, y, a, b, c) => 0.65 * vnoise(x, y, a, b, c * 2) + 0.35 * vnoise(x * 2 + 17.3, y * 2 - 9.1, a, b, c * 2 + 1);

// ================= биомы =================
const BIOMES = [
  ['Морская вода', '#2f5f98'], ['Пресная вода', '#5b9bd5'], ['Луга', '#b9d77a'], ['Лес', '#4f8a3c'],
  ['Болото', '#6f7f52'], ['Холмы', '#b49a64'], ['Горы', '#8a8580'], ['Пустыня', '#e6d08a'], ['Берег', '#f3ead0'],
  ['Дорога', '#8d7b68'],
];
const SEA = 0, FRESH = 1, SHORE = 8, ROAD = 9;
const WATER = new Set([SEA, FRESH]);
// вода «как водоём»: пресная/морская клетка, не являющаяся полосой реки
const isLakeOrSea = c => !!c && WATER.has(c.b) && !(c.data.rivers && c.data.rivers.band);
// биом «под» полосой реки/дороги — его видят дети при смешивании
const groundOf = c => { if (!c) return SEA; for (const ns of ['roads', 'rivers']) { const d = c.data[ns]; if (d && d.band) return d.under; } return c.b; };
const INCL = { 0: [2], 1: [2], 2: [3, 1, 5, 4], 3: [1, 2, 4, 5], 4: [1, 3], 5: [3, 2, 6, 1], 6: [5, 1], 7: [5, 2, 1], 8: [2], 9: [] };
const SIZE = ['1 м', '10 м', '100 м', '1 км', '10 км'];
const TOP = 4, COLS = 16, ROWS = 10;
const topAxial = (col, row) => [col, row - ((col - (col & 1)) / 2)];

// ================= линейные объекты: реки и дороги =================
// Узел в клетке: data[ns] = { ports: [{e: ребро 0..5, s: слот -1|0|1, size: ширина в метрах, io: in|out|both}], town? }
// или полоса: data[ns] = { band: true, size, segs: [{size, pts}] } — когда объект шире порога для масштаба клетки.
let ROAD_TYPES = [{ name: 'Тракт', w: 12 }, { name: 'Дорога', w: 6 }, { name: 'Просёлок', w: 3 }, { name: 'Тропа', w: 1 }];
const NS_KH = { rivers: strHash('rivers'), roads: strHash('roads') };
// слот на ребре: хэш КАНОНИЧЕСКОГО ребра (владелец + своё ребро) → обе стороны получают одно и то же
function canonEdge(q, r, e) { return OWNED.has(e) ? [q, r, e] : [q + DIRS[e][0], r + DIRS[e][1], (e + 3) % 6]; }
function edgeSlot(lvl, q, r, e, kh) { const [cq, cr, ce] = canonEdge(q, r, e); return Math.floor(hash(kh, lvl, cq, cr, ce, 991) * 3) - 1; }
// точка стыковки на ребре: середина ребра ± 0.3 длины. При size=10 (родитель в координатах детей) это ровно центр ребёнка на ребре.
function portXY(q, r, e, s, size) {
  const [cq, cr, ce] = canonEdge(q, r, e);
  const [cx, cy] = toPx(cq, cr, size), [nx, ny] = toPx(cq + DIRS[ce][0], cr + DIRS[ce][1], size);
  const len = Math.hypot(nx - cx, ny - cy), ux = (nx - cx) / len, uy = (ny - cy) / len;
  return [(cx + nx) / 2 - uy * 0.3 * size * s, (cy + ny) / 2 + ux * 0.3 * size * s];
}
function addPort(nd, e, s, size, io, t) { const ex = nd.ports.find(p => p.e === e); if (ex) { ex.size = Math.max(ex.size, size); if (t != null) ex.t = ex.t == null ? t : Math.min(ex.t, t); return; } const p = { e, s, size, io }; if (t != null) p.t = t; nd.ports.push(p); }
function curvePts([ax, ay], [bx, by], tA, tB, amp, kh, pid, lc, idx) {
  const d = Math.hypot(bx - ax, by - ay), k = 0.35 * d + 1, nx = -(by - ay) / (d || 1), ny = (bx - ax) / (d || 1);
  const p1 = [ax + tA[0] * k, ay + tA[1] * k], p2 = [bx - tB[0] * k, by - tB[1] * k], pts = [], N = Math.max(8, Math.ceil(d * 4));
  for (let i = 0; i <= N; i++) {
    const t = i / N, u = 1 - t;
    const x = u * u * u * ax + 3 * u * u * t * p1[0] + 3 * u * t * t * p2[0] + t * t * t * bx;
    const y = u * u * u * ay + 3 * u * u * t * p1[1] + 3 * u * t * t * p2[1] + t * t * t * by;
    const off = amp * Math.sin(Math.PI * t) * (2 * vnoise(t * 3, idx, kh, pid, lc) - 1);
    pts.push([x + nx * off, y + ny * off]);
  }
  return pts;
}
function removeLoops(cells) {
  const res = [], idx = new Map();
  for (const c of cells) {
    const k = K(c[0], c[1]);
    if (idx.has(k)) { for (const r of res.splice(idx.get(k) + 1)) idx.delete(K(r[0], r[1])); continue; }
    idx.set(k, res.length); res.push(c);
  }
  return res;
}
function rasterize(pts) {
  const out = [];
  for (const [x, y] of pts) {
    const c = childRound(x, y), last = out[out.length - 1];
    if (last && last[0] === c[0] && last[1] === c[1]) continue;
    if (last && hexDist(last, c) > 1) for (const m of hexLine(last, c).slice(1, -1)) out.push(m);
    out.push(c);
  }
  return removeLoops(out);
}
function segDist(x, y, pts) {
  let best = Infinity;
  for (let i = 0; i < pts.length; i++) {
    const [ax, ay] = pts[i], [bx, by] = pts[Math.min(i + 1, pts.length - 1)], dx = bx - ax, dy = by - ay, l2 = dx * dx + dy * dy;
    const t = l2 ? Math.max(0, Math.min(1, ((x - ax) * dx + (y - ay) * dy) / l2)) : 0;
    best = Math.min(best, Math.hypot(x - ax - t * dx, y - ay - t * dy));
  }
  return best;
}
function windowPts(pts, x, y, r) {
  let i0 = -1, i1 = -1; pts.forEach(([px, py], i) => { if (Math.hypot(px - x, py - y) <= r) { if (i0 < 0) i0 = i; i1 = i; } });
  if (i0 < 0) return [];
  return pts.slice(Math.max(0, i0 - 1), i1 + 2).map(([a, b]) => [+a.toFixed(2), +b.toFixed(2)]);
}
// Осевые кривые и цепочки клеток для узла родителя (Q,R). Всё в координатах уровня детей lc.
// Через точку стыковки кривая проходит поперёк ребра: [снаружи, на ребре, внутри] — у обоих соседей одинаково.
function buildChains(lc, Q, R, node, kh, meander, ownedFn) {
  const [px, py] = toPx(Q, R, 10);
  const J = childRound(px + (hash(kh, lc, Q, R, 31) - 0.5) * 5, py + (hash(kh, lc, Q, R, 32) - 0.5) * 5);
  const ports = node.ports.map(p => { const pc = childRound(...portXY(Q, R, p.e, p.s, 10)), [dq, dr] = DIRS[p.e];
    return { ...p, pc, inner: [pc[0] - dq, pc[1] - dr], outer: [pc[0] + dq, pc[1] + dr] }; });
  const ins = ports.filter(p => p.io === 'in'), out = ports.find(p => p.io === 'out'), both = ports.filter(p => p.io === 'both');
  const specs = [];
  if (both.length) { if (both.length === 2 && !node.town) specs.push([both[0], both[1], Math.max(both[0].size, both[1].size), Math.min(both[0].t ?? 99, both[1].t ?? 99)]); else both.forEach(p => specs.push([p, null, p.size, p.t])); }
  else if (out && ins.length === 1) specs.push([ins[0], out, out.size]);
  else { if (out) specs.push([null, out, out.size]); ins.forEach(p => specs.push([p, null, p.size])); }
  let fail = 0;
  const chains = specs.map(([a, b, size, t], idx) => {
    const start = a ? a.inner : J, end = b ? b.inner : J, S0 = toPx(...start), E0 = toPx(...end);
    const cl = Math.hypot(E0[0] - S0[0], E0[1] - S0[1]) || 1, cu = [(E0[0] - S0[0]) / cl, (E0[1] - S0[1]) / cl];
    const tA = a ? unitDir((a.e + 3) % 6) : cu, tB = b ? unitDir(b.e) : cu;
    const pre = a ? [a.outer, a.pc] : [], post = b ? [b.pc, b.outer] : [];
    const attempt = amp => { const pts = curvePts(S0, E0, tA, tB, amp, kh, Q * 7919 + R, lc, idx); return { pts, cells: removeLoops([...pre, ...rasterize(pts), ...post]) }; };
    const ok = cells => cells.slice(pre.length, cells.length - post.length).every(c => ownedFn(c[0], c[1]));
    let r = attempt(meander);
    if (!ok(r.cells)) r = attempt(0);
    if (!ok(r.cells)) { const cells = removeLoops([...pre, ...hexLine(start, end), ...post]); r = { pts: cells.slice(pre.length, cells.length - post.length).map(c => toPx(...c)), cells }; if (!ok(cells)) fail++; }
    return { fromJ: !a, toJ: !b, cells: r.cells, size, t: t === 99 ? undefined : t, pts: [...pre.map(c => toPx(...c)), ...r.pts, ...post.map(c => toPx(...c))] };
  });
  return { chains, J, fail };
}
// Общий шаг «линия родителя → дети»: цепочки (если объект ýже порога) или полоса клеток (если шире).
function refineLinear(ctx, ns, bandBiome, P) {
  const lc = ctx.lvl, kh = NS_KH[ns], scale = Math.pow(10, lc);
  const isBand = size => size >= P.K * scale, halfW = size => size / scale; // ширина гекса = 2 единицы
  const own = (q, r) => ctx.byKey.get(K(q, r));
  const node = c => c.data[ns] || (c.data[ns] = { ports: [] });
  const segs = [], lineChains = []; let fail = 0, J = null, town = false, myNd = null;
  for (const [a, b] of [[0, 0], ...DIRS]) {
    const pq = ctx.Q + a, pr = ctx.R + b, above = ctx.cellAbove(pq, pr), nd = above && above.data[ns];
    if (!nd) continue;
    const mine = a === 0 && b === 0;
    if (nd.ports) {
      const res = buildChains(lc, pq, pr, nd, kh, P.meander, (q, r) => { const [x, y] = parentOf(q, r); return x === pq && y === pr; });
      if (mine) { fail = res.fail; J = res.J; town = nd.town || false; myNd = nd; }
      for (const ch of res.chains) { if (isBand(ch.size)) segs.push({ size: ch.size, pts: ch.pts, cells: mine ? ch.cells : null }); else if (mine) lineChains.push(ch); }
    }
    if (nd.segs) for (const s of nd.segs) segs.push({ size: s.size, pts: s.pts.map(([x, y]) => [x * 10, y * 10]) });
  }
  // полоса: свои клетки ближе половины ширины к любой оси (своей или соседской — считается одинаково по обе стороны границы)
  const band = new Map(), put = (c, size) => band.set(c, Math.max(band.get(c) || 0, size));
  for (const s of segs) if (s.cells) for (const c of s.cells) { const m = own(c[0], c[1]); if (m && !isLakeOrSea(m)) put(m, s.size); }
  for (const c of ctx.cells) if (!isLakeOrSea(c)) for (const s of segs) if (segDist(c.x, c.y, s.pts) <= halfW(s.size)) put(c, s.size);
  for (const [c, size] of band) {
    const under = groundOf(c); c.b = bandBiome;
    const near = segs.map(s => ({ size: s.size, pts: windowPts(s.pts, c.x, c.y, halfW(s.size) + 3) })).filter(s => s.pts.length);
    c.data[ns] = { band: true, size, under, segs: near };
  }
  // линии: цепочки клеток, у каждой клетки — свои точки стыковки с соседями по цепочке
  const used = new Set(band.keys()), io = ns === 'rivers' ? ['out', 'in'] : ['both', 'both'], river = ns === 'rivers';
  const wet = cc => isLakeOrSea(own(cc[0], cc[1]));
  const hasIo = io => !!myNd && myNd.ports.some(p => p.io === io), wetParent = WATER.has(ctx.dom);
  // путь по своим клеткам от cc до ближайшей воды (водоём), без самой cc
  const toWater = cc => { const st = own(cc[0], cc[1]); if (!st) return null; const prev = new Map([[st, null]]), qu = [st];
    while (qu.length) { const x = qu.shift(); if (isLakeOrSea(x)) { const p = []; for (let y = x; y !== st; y = prev.get(y)) p.unshift([y.q, y.r]); return p; }
      for (const [a, b] of DIRS) { const y = ctx.byKey.get(K(x.q + a, x.r + b)); if (y && !prev.has(y)) { prev.set(y, x); qu.push(y); } } } return null; };
  for (const ch of lineChains) {
    let cells = ch.cells;
    if (river && wetParent && ch.toJ && !hasIo('out')) { // река здесь кончается → в первую воду по пути, иначе до ближайшей воды от центра
      const i = cells.findIndex(wet); if (i >= 0) cells = cells.slice(0, i + 1); else { const p = toWater(cells[cells.length - 1]); if (p) cells = [...cells, ...p]; } }
    if (river && wetParent && ch.fromJ && !hasIo('in')) { // сток из водоёма → от последней воды по пути
      const i = cells.map(wet).lastIndexOf(true); if (i >= 0) cells = cells.slice(i); else { const p = toWater(cells[0]); if (p) cells = [...p.reverse(), ...cells]; } }
    let prev = null;
    for (const cc of cells) {
      const cur = own(cc[0], cc[1]);
      if (prev) {
        const d = dirIndex(prev, cc);
        if (d >= 0 && !(river && wet(prev) && wet(cc))) { // по воде река линией не идёт
          const s = edgeSlot(lc, prev[0], prev[1], d, kh), pa = own(prev[0], prev[1]);
          if (pa && !band.has(pa)) addPort(node(pa), d, s, ch.size, io[0], ch.t);
          if (cur && !band.has(cur)) addPort(node(cur), (d + 3) % 6, s, ch.size, io[1], ch.t);
        }
        if (cur && used.has(cur)) break; // влились в уже проложенную ветку или полосу
      }
      if (cur) used.add(cur);
      prev = cc;
    }
  }
  if (town && J) { const j = own(J[0], J[1]); if (j && !band.has(j)) node(j).town = town; }
  const st = { ветвей: lineChains.length, 'клеток полосы': band.size }; if (fail) st['ошибок трассировки'] = fail; return st;
}

// ================= ПРАВИЛА =================
// stage: top — вся карта верхнего уровня; draft — своя пачка + уровень выше; final — своя пачка + ЧЕРНОВИКИ 6 соседей (только чтение).
// ns — пространство имён в c.data, куда правило пишет (по умолчанию = id). Случайность у каждого правила своя.
// forbids — пары биомов, которые не должны соседствовать; их проверяет общая проверка стыков.
const RULES = [
  { id: 'top.base', stage: 'top', locked: true, name: 'Высота и влажность → биом', params: [],
    apply(ctx) {
      for (const c of ctx.cells) {

          if (blocked(m) || ctx.rand(m.q, m.r, t, depth) >= P[depth]) continue;
          m.b = t; m.data[this.ns] = { тип: BIOMES[t][0], глубина: depth + 1 }; n++;
          for (const [a, b] of DIRS) { const k = ctx.byKey.get(K(m.q + a, m.r + b)); if (k && !blocked(k)) next.push([k, t]); }
        }
        front = next;
      }
      return { клеток: n };
    } },
  { id: 'final.enclosedWater', stage: 'final', name: 'Вода внутри гекса, не касающаяся края → озеро', params: [{ key: 'maxSize', label: 'Макс. размер', min: 1, max: 60, step: 1, value: 30 }],
    apply(ctx) {
      const comps = waterComponents(ctx.cells, c => DIRS.map(([a, b]) => ctx.byKey.get(K(c.q + a, c.r + b))), c => c.b === SEA);
      let lakes = 0;
      for (const comp of comps) {
        if (comp.edge || comp.cells.length > ctx.p.maxSize) continue; // касается края → не знаем, куда ведёт → остаётся океаном
        for (const c of comp.cells) { c.b = FRESH; c.data[this.ns] = { вода: 'пресная', размер: comp.cells.length }; }
        lakes++;
      }
      return { озёр: lakes };
    } },
  { id: 'final.lakeShore', stage: 'final', name: 'Пресная вода у морской → берег (кроме устьев рек)', forbids: [[FRESH, SEA]], exempt: c => !!c.data.rivers, params: [],
    // только убирает спорный биом со своей стороны и не создаёт океан → проверки по черновику соседа достаточно
    apply(ctx) {
      let n = 0;
      for (const c of ctx.cells) if (c.b === FRESH && !c.data.rivers && DIRS.some(([a, b]) => ctx.biomeAt(c.q + a, c.r + b) === SEA)) { c.b = SHORE; c.data[this.ns] = { было: 'пресная вода' }; n++; }
      return { клеток: n };
    } },
];
RULES.forEach(r => { r.enabled = true; r.ns = r.ns || r.id; r.h = strHash(r.id); r.values = Object.fromEntries(r.params.map(p => [p.key, p.value])); });

function waterComponents(cells, nbFn, isWater) {
  const seen = new Set(), comps = [];
  for (const c of cells) {
    if (!isWater(c) || seen.has(c)) continue;
    const comp = { cells: [], edge: false }, stack = [c]; seen.add(c);
    while (stack.length) { const x = stack.pop(); comp.cells.push(x); for (const nb of nbFn(x)) { if (!nb) { comp.edge = true; continue; } if (isWater(nb) && !seen.has(nb)) { seen.add(nb); stack.push(nb); } } }
    comps.push(comp);

}
function runStage(stage, base) {
  const stats = {};
  for (const r of RULES) {
    if (r.stage !== stage || !(r.enabled || r.locked)) continue;
    const ctx = Object.assign({}, base, {
      p: r.values,
      rand: (...n) => hash(r.h, base.lvl, ...n),
      rng: (...n) => rngFrom(r.h, base.lvl, ...n),
      noise: (x, y, t) => fbm(x, y, r.h, base.lvl, t),

const deepFreeze = c => { for (const v of Object.values(c.data)) Object.freeze(v); Object.freeze(c.data); return Object.freeze(c); };

// ================= движок генерации =================
let topCells = [], topByKey = new Map(), topStats = {};
function generateTop() {
  topCells = [];
  for (let row = 0; row < ROWS; row++) for (let col = 0; col < COLS; col++) { const [q, r] = topAxial(col, row); topCells.push({ q, r, col, row, b: SEA, data: {} }); }
  topByKey = new Map(topCells.map(c => [K(c.q, c.r), c]));
  topStats = runStage('top', { lvl: TOP, cells: topCells, byKey: topByKey, nb: c => DIRS.map(([a, b]) => topByKey.get(K(c.q + a, c.r + b))) });
}
const cache = new Map();
function getCell(L, q, r) {
  if (L === TOP) return topByKey.get(K(q, r)) || null;

}
const getBiome = (L, q, r) => { const c = getCell(L, q, r); return c ? c.b : SEA; };
function getDraft(L, Q, R) {

  const dom = groundOf(getCell(L, Q, R)), [px, py] = toPx(Q, R, 10);
  const parents = RING2.map(([a, b]) => { const [x, y] = toPx(Q + a, R + b, 10); return { b: groundOf(getCell(L, Q + a, R + b)), x, y }; });
  const cells = CHILD_OFFSETS.map(([dq, dr], idx) => {
    const q = 10 * Q + dq, r = 10 * R + dr, [x, y] = toPx(q, r);
    return { q, r, idx, x, y, f: Math.max(0, 1 - hexNorm(x - px, y - py, 10)), b: -1, data: {} };
  });
  const byKey = new Map(cells.map(c => [K(c.q, c.r), c]));
  const stats = runStage('draft', { lvl: L - 1, L, Q, R, dom, parents, cells, byKey, cellAbove: (q, r) => getCell(L, q, r) });
  cells.forEach(deepFreeze);

}
function getBatch(L, Q, R) {
  const key = L + ':' + Q + ':' + R; if (cache.has(key)) return cache.get(key);
  const draft = getDraft(L, Q, R);
  const cells = draft.cells.map(c => ({ ...c, data: { ...c.data } }));
  const byKey = new Map(cells.map(c => [K(c.q, c.r), c]));
  const neighborDrafts = DIRS.map(([a, b]) => getDraft(L, Q + a, R + b));
  const biomeAt = (q, r) => { const m = byKey.get(K(q, r)); if (m) return m.b; for (const d of neighborDrafts) { const o = d.byKey.get(K(q, r)); if (o) return o.b; } return null; };
  const stats = runStage('final', { lvl: L - 1, L, Q, R, dom: draft.dom, cells, byKey, neighborDrafts, biomeAt });
  const shares = new Map(); for (const c of cells) shares.set(c.b, (shares.get(c.b) || 0) + 1);
  const batch = { cells, byKey, dom: draft.dom, shares, stats: { ...draft.stats, ...stats } };
  cache.set(key, batch); return batch;
}

// ================= проверки (общие для всех правил) =================
const forbiddenPairs = () => RULES.filter(r => r.enabled && r.forbids).flatMap(r => r.forbids.map(p => [...p, r.exempt || (() => false)]));
// клетка уровня lvl лежит за краем карты верхнего уровня (туда реки просто вытекают)
function offMap(lvl, q, r) { for (let l = lvl; l < TOP; l++) [q, r] = parentOf(q, r); return !topByKey.has(K(q, r)); }
function countViolations(batches, lvl) {
  const pairs = forbiddenPairs(), bad = (a, b) => pairs.some(([x, y, ex]) => ((a.b === x && b.b === y) || (a.b === y && b.b === x)) && !ex(a) && !ex(b));
  const all = new Map(); batches.forEach((b, i) => b.cells.forEach(c => all.set(K(c.q, c.r), [i, c])));

    // реки и дороги: у соседа по каждой точке стыковки должна быть ответная (или полоса того же типа)
    for (const ns of ['rivers', 'roads']) {
      const nd = c.data[ns]; if (!nd || !nd.ports) continue;
      for (const p of nd.ports) {
        const o = all.get(K(c.q + DIRS[p.e][0], c.r + DIRS[p.e][1])); if (!o) continue; const on = o[1].data[ns];
        if (!(on && (on.band || (on.ports && on.ports.some(x => x.e === (p.e + 3) % 6 && x.s === p.s)))) && !offMap(lvl, o[1].q, o[1].r)) breaks++;

}
function runSeamCheck() {
  const saved = SEED; let views = 0, total = 0, border = 0, breaks = 0, orderOk = true;
  const view = (L, q, r) => [[q, r], ...DIRS.map(([a, b]) => [q + a, r + b])].map(([a, b]) => getBatch(L, a, b));
  for (let sd = 1; sd <= 10; sd++) {
    SEED = sd; cache.clear(); generateTop();
    for (const t of topCells) {
      const v1 = view(TOP, t.q, t.r);
      const c = v1[0].cells.find(c => c.data.rivers && c.data.rivers.ports) || v1[0].cells.find(c => c.data.roads && c.data.roads.ports) || v1[0].cells[50];
      const v2 = view(TOP - 1, c.q, c.r);
      for (const v of [countViolations(v1, TOP - 1), countViolations(v2, TOP - 2)]) { views++; total += v.total; border += v.border; breaks += v.breaks; }
    }
    const t = topCells[(sd * 37) % topCells.length], A = JSON.stringify(getBatch(TOP, t.q, t.r).cells.map(c => [c.b, c.data.rivers, c.data.roads]));
    cache.clear(); DIRS.forEach(([a, b]) => getBatch(TOP, t.q + a, t.r + b));
    if (A !== JSON.stringify(getBatch(TOP, t.q, t.r).cells.map(c => [c.b, c.data.rivers, c.data.roads]))) orderOk = false;
  }
  SEED = saved; cache.clear(); generateTop();
  const pairs = forbiddenPairs().map(([a, b]) => BIOMES[a][0] + '–' + BIOMES[b][0]).join(', ') || 'нет';
  document.getElementById('check').textContent = `Проверка: ${views} видов. Запрещённые соседства (${pairs}): ${total} (на стыках: ${border}). Разрывов рек/дорог: ${breaks}. Порядок открытия ${orderOk ? 'не влияет ✔' : 'ВЛИЯЕТ ✘'}`;
  render();
}

// ================= отрисовка =================
const svg = document.getElementById('svg'), status = document.getElementById('status'), info = document.getElementById('info');
const hexPts = (cx, cy, size) => Array.from({ length: 6 }, (_, k) => { const a = Math.PI / 3 * k; return `${(cx + size * Math.cos(a)).toFixed(3)},${(cy + size * Math.sin(a)).toFixed(3)}`; }).join(' ');
const ruleName = id => (RULES.find(r => r.id === id) || { name: id }).name;
const statsHtml = st => Object.entries(st).filter(([, v]) => Object.keys(v).length).map(([id, v]) => `<div class="meta">${ruleName(id)}: ${Object.entries(v).map(([k, x]) => k + ' ' + x).join(', ')}</div>`).join('');
const short = data => JSON.stringify(data, (k, v) => k === 'pts' ? `[${v.length} точек]` : v);
const cellText = (lvl, c, extra) => `Ур. ${lvl} (${SIZE[lvl]}) · ${extra} · ${BIOMES[c.b][0]}\ndata: ${short(c.data)}`;
function linearSvg(cells, ox, oy, lvl) {
  let h = '';
  for (const ns of ['rivers', 'roads']) for (const c of cells) {
    const nd = c.data[ns]; if (!nd || !nd.ports) continue;
    const [cx, cy] = toPx(c.q, c.r);
    for (const p of (ns === 'rivers' && isLakeOrSea(c)) ? [] : nd.ports) { // в водоёме река не рисуется
      const [x, y] = portXY(c.q, c.r, p.e, p.s, 1), w = Math.min(0.7, Math.max(ns === 'rivers' ? 0.1 : 0.06 + (p.t != null ? 0.05 * Math.max(0, ROAD_TYPES.length - 2 - p.t) : 0.02), 2 * p.size / Math.pow(10, lvl))); // дороги: условная толщина по рангу
      h += `<line x1="${(x - ox).toFixed(3)}" y1="${(y - oy).toFixed(3)}" x2="${(cx - ox).toFixed(3)}" y2="${(cy - oy).toFixed(3)}" stroke="${ns === 'rivers' ? '#1f6fd1' : '#6b3d1f'}" stroke-width="${w.toFixed(3)}" stroke-linecap="round" pointer-events="none"/>`;
    }
    if (nd.town) h += `<circle cx="${(cx - ox).toFixed(3)}" cy="${(cy - oy).toFixed(3)}" r="${0.15 + 0.1 * nd.town}" fill="#c0392b" stroke="#fff" stroke-width="0.08" pointer-events="none"/>`;
    if (nd.hamlet) h += `<circle cx="${(cx - ox).toFixed(3)}" cy="${(cy - oy).toFixed(3)}" r="0.18" fill="#8a5a2b" stroke="#fff" stroke-width="0.06" pointer-events="none"/>`;
    if (nd.spring) h += `<circle cx="${(cx - ox).toFixed(3)}" cy="${(cy - oy).toFixed(3)}" r="0.22" fill="#fff" stroke="#1f6fd1" stroke-width="0.08" pointer-events="none"/>`;
  }
  return h;
}
let stack = [];
function render() { renderCrumbs(); if (!stack.length) renderTop(); else renderChildren(stack[stack.length - 1]); }
function renderTop() {
  const maxX = 1.5 * (COLS - 1) + 1, maxY = SQ3 * (ROWS - 0.5) + SQ3 / 2;
  svg.setAttribute('viewBox', `-1.2 ${-SQ3 / 2 - 0.2} ${maxX + 2.4} ${maxY + SQ3 / 2 + 0.4}`);
  svg.innerHTML = topCells.map((c, i) => { const [x, y] = toPx(c.q, c.r); return `<polygon points="${hexPts(x, y, 1)}" fill="${BIOMES[c.b][1]}" stroke="#0003" stroke-width="0.05" data-i="${i}"/>`; }).join('') + linearSvg(topCells, 0, 0, TOP);
  info.innerHTML = `Верхний уровень: ${COLS}×${ROWS}, гекс = ${SIZE[TOP]}.<br>Клик по гексу — провалиться внутрь.${statsHtml(topStats)}`;
  svg.onclick = e => { const i = e.target.dataset.i; if (i == null) return; const c = topCells[+i]; stack.push({ L: TOP, Q: c.q, R: c.r, label: c.col + ',' + c.row }); render(); };
  svg.onmousemove = e => { const i = e.target.dataset.i; if (i == null) return; const c = topCells[+i]; status.textContent = cellText(TOP, c, `столбец ${c.col}, строка ${c.row}`); };
}
function renderChildren({ L, Q, R }) {
  const [px, py] = toPx(Q, R, 10);
  svg.setAttribute('viewBox', '-28 -27 56 54');
  const parents = [[Q, R], ...DIRS.map(([a, b]) => [Q + a, R + b])], batches = parents.map(([a, b]) => getBatch(L, a, b));
  let h = '';
  batches.forEach((batch, i) => { for (const c of batch.cells) h += `<polygon points="${hexPts(c.x - px, c.y - py, 1)}" fill="${BIOMES[c.b][1]}" stroke="#0002" stroke-width="0.05" opacity="${i ? 0.45 : 1}" data-p="${i}" data-k="${c.idx}"/>`; });
  h += linearSvg(batches.flatMap(b => b.cells), px, py, L - 1);
  parents.forEach(([pq, pr], i) => { const [x, y] = toPx(pq, pr, 10); h += `<polygon points="${hexPts(x - px, y - py, 10)}" fill="none" stroke="#222" stroke-width="${i ? 0.08 : 0.2}" stroke-dasharray="0.6 0.4" pointer-events="none"/>`; });
  svg.innerHTML = h;
  const b = batches[0], v = countViolations(batches, L - 1);
  const rows = [...b.shares].sort((a, c) => c[1] - a[1]).map(([bb, n]) => `<div><span class="sw" style="background:${BIOMES[bb][1]}"></span>${BIOMES[bb][0]} — ${n}%</div>`).join('');
  info.innerHTML = `Гекс уровня ${L} (${SIZE[L]}): <b>${BIOMES[b.dom][0]}</b><br>Внутри — уровень ${L - 1} (${SIZE[L - 1]}):${rows}${statsHtml(b.stats)}` +
    `<div>Нарушений соседства на экране: <b>${v.total}</b> (на стыках: ${v.border}), разрывов рек/дорог: <b>${v.breaks}</b></div><div class="meta">Клик по яркой клетке — глубже, по бледной — в соседний гекс.</div>`;
  svg.onclick = e => {
    const d = e.target.dataset; if (d.p == null) return; const c = batches[+d.p].cells[+d.k];
    if (+d.p === 0) { if (L - 1 >= 1) { stack.push({ L: L - 1, Q: c.q, R: c.r, label: '#' + c.idx }); render(); } }
    else { const top = stack[stack.length - 1]; stack[stack.length - 1] = { L, Q: parents[+d.p][0], R: parents[+d.p][1], label: top.label + '→' + DIRS_RU[+d.p - 1] }; render(); }
  };
  svg.onmousemove = e => { const d = e.target.dataset; if (d.p == null) return; const c = batches[+d.p].cells[+d.k]; status.textContent = cellText(L - 1, c, `клетка #${c.idx}${+d.p ? ' соседнего гекса' : ''}`); };
}
function renderCrumbs() {
  const el = document.getElementById('crumbs');
  el.innerHTML = `<button data-i="-1">Мир</button>` + stack.map((s, i) => `<button data-i="${i}">Ур.${s.L} ${s.label}</button>`).join('');
  el.onclick = e => { const i = e.target.dataset.i; if (i == null) return; stack = stack.slice(0, +i + 1); render(); };

const STAGES = [['top', 'Верхний уровень (видит всю карту)'], ['draft', 'Черновик (своя пачка + уровень выше)'], ['final', 'Итог (+ черновики соседей, только чтение)']];
function renderRules() {
  const el = document.getElementById('rules');
  el.innerHTML = STAGES.map(([st, title]) => `<div class="stage">${title}</div>` + RULES.map((r, i) => r.stage !== st ? '' : `
    <div class="rule"><div class="head">
      <input type="checkbox" data-en="${i}" ${r.enabled || r.locked ? 'checked' : ''} ${r.locked ? 'disabled' : ''}>
      <span>${r.name}${r.locked ? ' <span class="meta">(базовое)</span>' : ''}</span>
      ${r.locked ? '' : `<button data-up="${i}">↑</button><button data-down="${i}">↓</button>`}</div>
      <div class="meta">${r.id}${r.ns !== r.id ? ' · data.' + r.ns : ''}${r.forbids ? ' · запрещает: ' + r.forbids.map(([a, b]) => BIOMES[a][0] + '–' + BIOMES[b][0]).join(', ') : ''}</div>
      ${r.params.map(p => `<label>${p.label} <input type="range" min="${p.min}" max="${p.max}" step="${p.step}" value="${r.values[p.key]}" data-r="${i}" data-k="${p.key}"><b>${r.values[p.key]}</b></label>`).join('')}
    </div>`).join('')).join('');
}
const rulesEl = document.getElementById('rules');
rulesEl.addEventListener('input', e => {
  const d = e.target.dataset;
  if (d.en != null) RULES[+d.en].enabled = e.target.checked;
  if (d.r != null) { RULES[+d.r].values[d.k] = +e.target.value; e.target.nextElementSibling.textContent = e.target.value; }
  regen(false);
});
rulesEl.addEventListener('click', e => {
  const d = e.target.dataset, i = d.up != null ? +d.up : d.down != null ? +d.down : null; if (i == null) return;
  const dir = d.up != null ? -1 : 1; let j = i + dir;
  while (j >= 0 && j < RULES.length && RULES[j].stage !== RULES[i].stage) j += dir;
  if (j < 0 || j >= RULES.length || RULES[j].locked) return; // базовое правило всегда первое в своём этапе
  [RULES[i], RULES[j]] = [RULES[j], RULES[i]]; regen(true);
});
document.getElementById('legend').innerHTML = BIOMES.map(([n, c]) => `<div><span style="background:${c}"></span>${n}</div>`).join('') +
  '<div class="meta">Линии: синие — реки и ручьи (○ — родник), коричневые — дороги, толщина по типу (красный ● — поселение, крупнее = больше; коричневый ● — хутор)</div>';
function renderRoadTypes() {
  const el = document.getElementById('roadTypes');
  el.innerHTML = ROAD_TYPES.map((t, i) => `<div class="rule" style="display:flex;gap:6px;align-items:center">${i + 1}. <input data-rt="${i}" data-f="name" value="${t.name}" style="width:110px"> ширина <input data-rt="${i}" data-f="w" type="number" min="0.5" step="0.5" value="${t.w}" style="width:60px"> м <button data-rdel="${i}" ${ROAD_TYPES.length < 2 ? 'disabled' : ''}>✕</button></div>`).join('') + '<button id="rtAdd">+ тип</button>';
}
document.getElementById('roadTypes').addEventListener('change', e => { const d = e.target.dataset; if (d.rt == null) return; const t = ROAD_TYPES[+d.rt]; if (d.f === 'w') t.w = Math.max(0.5, +e.target.value || 1); else t.name = e.target.value || t.name; regen(false); });
document.getElementById('roadTypes').addEventListener('click', e => {
  const d = e.target.dataset;
  if (d.rdel != null && ROAD_TYPES.length > 1) ROAD_TYPES.splice(+d.rdel, 1);
  else if (e.target.id === 'rtAdd') ROAD_TYPES.push({ name: 'Тип ' + (ROAD_TYPES.length + 1), w: Math.max(0.5, ROAD_TYPES[ROAD_TYPES.length - 1].w / 2) });
  else return;
  renderRoadTypes(); regen(false);
});
function regen(redrawRules = true) {
  SEED = +document.getElementById('seed').value | 0;
  cache.clear(); generateTop(); if (redrawRules) renderRules(); render();
}
document.getElementById('seed').addEventListener('input', () => regen(false));
document.getElementById('rnd').onclick = () => { document.getElementById('seed').value = Math.floor(Math.random() * 100000); regen(false); };
document.getElementById('checkBtn').onclick = () => { document.getElementById('check').textContent = 'Проверяю…'; setTimeout(runSeamCheck, 20); };
renderRoadTypes();
regen();
</script></body></html>
