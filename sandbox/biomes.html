<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><title>Biome sandbox</title>
<style>
body{font-family:sans-serif;background:#fff;color:#222;margin:12px}
.controls{display:flex;flex-wrap:wrap;gap:14px;align-items:center;font-size:14px;margin-bottom:8px}
.crumbs button{margin-right:4px}
.wrap{display:flex;flex-wrap:wrap;gap:16px;align-items:flex-start}
svg{border:1px solid #ccc;width:min(720px,100%);height:auto;background:#f6f6f6}
#svg polygon:hover{stroke:#000;stroke-width:.15}
.side{font-size:13px;width:340px;max-width:100%}
.legend span,.sw{display:inline-block;width:11px;height:11px;margin-right:6px;vertical-align:middle;border:1px solid #0003}
.mapbox{position:relative;width:min(720px,100%)}
.mapbox svg{width:100%;aspect-ratio:4/3;touch-action:none;cursor:grab;user-select:none}
#status{position:absolute;left:6px;bottom:6px;right:6px;max-height:30%;overflow:auto;font-size:11px;font-family:monospace;white-space:pre-wrap;word-break:break-all;background:#fffe;border:1px solid #ccc;border-radius:4px;padding:3px 5px;pointer-events:none}
#status:empty{display:none}
#lvl{position:absolute;top:6px;right:6px;max-width:58%;max-height:80%;overflow:auto;font-size:12px;background:#fffe;border:1px solid #ccc;border-radius:4px;padding:3px 6px}
#lvl summary{cursor:pointer;font-weight:bold}
.stage{margin:8px 0 2px;font-weight:bold}
.rule{border:1px solid #ddd;border-radius:4px;padding:4px 6px;margin:3px 0}
.rule .head{display:flex;align-items:center;gap:6px}
.rule .head span{flex:1}
.rule .head button{padding:0 5px}
.meta{color:#888;font-size:11px}
.rule label{display:flex;gap:6px;align-items:center;font-size:12px;margin-top:2px}
.rule input[type=range]{flex:1}
#check{font-size:13px;white-space:pre-wrap}
</style></head><body>
<h3>Песочница карты — конвейер правил</h3>
<div class="controls">
  <label>Сид <input id="seed" type="number" value="1" style="width:90px"></label>
  <label>Кругосветка, гексов 1000 км <input id="wrapN" type="number" min="6" max="60" value="24" style="width:60px"></label>
  <button id="rnd">Другой сид</button>
  <button id="checkBtn">Проверить стыки (6 сидов, вкл. швы замыкания)</button>
  <label><input type="checkbox" id="wheelLevels"> Колесо меняет уровень</label>
  <label><input type="checkbox" id="editMode"> ✎ Править дороги</label> <select id="editType"></select> <button id="clearEdits">Сбросить правки</button> <span id="editCount" class="meta"></span>
</div>
<div id="check"></div>
<div class="crumbs" id="crumbs"></div>
<div class="wrap">
  <div class="mapbox"><svg id="svg"></svg><details id="lvl"><summary>ℹ Уровень</summary><div id="info"></div></details><div id="status"></div></div>
  <div class="side"><h4>Типы дорог <span class="meta">(сверху — главные; последний — тропы нижних уровней)</span></h4><div id="roadTypes"></div><h4>Правила</h4><div id="rules"></div><h4>Биомы</h4><div class="legend" id="legend"></div></div>
</div>
<script type="module" src="src/app.js"></script>
</body></html>
